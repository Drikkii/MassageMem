<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Прайс на массаж и эстетические процедуры у Екатерины Мухиной в Калининграде. Актуальные цены и запись на сеанс."
    />
    <meta name="robots" content="index, follow" />
    <title>Прайс — Екатерина Мухина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body data-page="price">
    <div id="site-header"></div>

    <main class="stub-page">
      <div class="container stub-content">
        <div class="price-gallery">
          <div class="price-card">
            <div class="price-banner-wrap">
              <img
                class="price-banner"
                src="img/красный фон.jpg"
                alt="Прайс"
                width="1200"
                height="800"
                loading="lazy"
              />
              <div class="price-decor" aria-hidden="true">
                <img
                  class="price-pimple"
                  src="img/пимпочка-прозрачная.png"
                  alt=""
                  width="44"
                  height="44"
                  loading="lazy"
                />
                <img
                  class="price-brushes"
                  src="img/кисточки-крассные-прозрачные.png"
                  alt=""
                  width="220"
                  height="260"
                  loading="lazy"
                />
              </div>
            </div>
          </div>
          <div class="price-card">
            <div class="price-banner-wrap">
              <img
                class="price-banner price-banner--flip"
                src="img/красный фон.jpg"
                alt="Прайс"
                width="1200"
                height="800"
                loading="lazy"
              />
              <div class="price-decor" aria-hidden="true">
                <img
                  class="price-pimple"
                  src="img/пимпочка-прозрачная.png"
                  alt=""
                  width="44"
                  height="44"
                  loading="lazy"
                />
                <img
                  class="price-brushes price-brushes--flip"
                  src="img/кисточки-крассные-прозрачные.png"
                  alt=""
                  width="220"
                  height="260"
                  loading="lazy"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-location"></div>

    <div id="site-footer"></div>

    <script src="js/site-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
