<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Контакты Екатерины Мухиной в Калининграде: адрес массажного кабинета, телефон, электронная почта и карта проезда."
    />
    <meta name="robots" content="index, follow" />
    <title>Контакты — Екатерина Мухина</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body data-page="contacts">
    <div id="site-header"></div>

    <main class="contacts-page">
      <div class="container contacts-content">
        <h1 class="contacts-title">Контакты</h1>
        <p class="contacts-lead">
          Массажный кабинет Екатерины Мухиной в <span data-site-city>Калининграде</span>.
          Запись по телефону или в мессенджерах.
        </p>

        <div class="contacts-grid">
          <div class="contacts-card">
            <h2 class="contacts-card-title">Город</h2>
            <p class="contacts-card-value">г. <span data-site-city>Калининград</span></p>
          </div>

          <div class="contacts-card">
            <h2 class="contacts-card-title">Адрес</h2>
            <p class="contacts-card-value">
              <a
                class="contacts-address"
                data-yandex-profile
                href="https://yandex.ru/maps/org/massazhny_kabinet/178427435576/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span data-site-address>Малоярославская ул., 6</span>
              </a>
            </p>
          </div>

          <div class="contacts-card">
            <h2 class="contacts-card-title">Телефон</h2>
            <p class="contacts-card-value">
              <a class="contacts-phone" href="tel:+79182859762">+7 918 285-97-62</a>
            </p>
          </div>

          <div class="contacts-card">
            <h2 class="contacts-card-title">Почта для сотрудничества</h2>
            <p class="contacts-card-value">
              <a class="contacts-email" href="mailto:mukhina.cosmo@mail.ru">mukhina.cosmo@mail.ru</a>
            </p>
          </div>

          <div class="contacts-card contacts-card--wide">
            <h2 class="contacts-card-title">Мессенджеры</h2>
            <div class="contacts-messengers">
              <a
                class="contacts-messenger"
                href="https://t.me/+79182859762"
                target="_blank"
                rel="noopener noreferrer"
              >
                Telegram
              </a>
              <a class="contacts-messenger" data-max-link href="#">MAX</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-location"></div>

    <div id="site-footer"></div>

    <script src="js/site-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
